name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.4"

jobs:
  analyse-et-tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Libellés (l10n)
        run: flutter gen-l10n

      - name: Génération de code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyse statique
        run: flutter analyze

      # Porte G5 : la règle est déclarée dans analysis_options.yaml et appliquée ici,
      # Dart n'offrant aucun lint natif d'interdiction d'import.
      - name: Frontières d'import (porte G5)
        run: dart run tool/check_import_boundaries.dart

      # Les références visuelles (test/widget/goldens) sont générées sous Windows ;
      # le rendu Linux diffère au pixel près. Elles se vérifient localement avec
      # `flutter test test/widget/goldens` et se ré-approuvent avec
      # `flutter test --update-goldens test/widget/goldens`.
      - name: Tests unitaires, de contrat et de widgets
        run: flutter test --reporter=github --exclude-tags=golden

  compilation-staging:
    name: Compilation de la saveur staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyse-et-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Libellés (l10n)
        run: flutter gen-l10n

      - name: Génération de code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Version applicative (pubspec.yaml)
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: APK staging
        run: >-
          flutter build apk --release --flavor staging
          --dart-define-from-file=env/staging.json
          --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: prestgo-staging-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 14

# Localisation — locale unique `fr`, formats calés sur `fr_CI` (R11).
#
# Les messages métier du service sont affichés **tels quels** : seuls les libellés
# propres à l'application vivent dans `lib/l10n/app_fr.arb`.

arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
nullable-getter: false
use-escaping: true

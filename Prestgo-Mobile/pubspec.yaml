name: prestgo_mobile
description: "Application mobile PRESTGO — surfaces client et prestataire."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # État (R1) — AsyncValue couvre chargement / erreur / vide
  flutter_riverpod: ">=3.0.0 <4.0.0"
  riverpod_annotation: ">=3.0.0 <5.0.0"

  # HTTP (R1, R8) — QueuedInterceptor pour le renouvellement sérialisé
  dio: ">=5.7.0 <6.0.0"

  # Navigation (R1, R14) — redirection unique porteuse du gardien
  go_router: ">=14.0.0 <18.0.0"

  # Jetons de session et jeton d'appareil (porte G6).
  # Bloqué sur la ligne 9.x : la 10.x passe par `objective_c`, dont les *build hooks*
  # empêchent `build_runner` de compiler son script sur ce couple Dart/analyzer.
  flutter_secure_storage: ">=9.2.0 <10.0.0"

  # Modèles immuables et sérialisation (R9)
  freezed_annotation: ">=2.4.0 <4.0.0"
  json_annotation: ">=4.8.0 <5.0.0"

  # Clé d'idempotence (R1) et formats fr_CI / XOF (R11)
  uuid: ">=4.0.0 <5.0.0"
  intl: ">=0.19.0 <0.21.0"

  # Bannière hors ligne (US10)
  connectivity_plus: ">=6.0.0 <8.0.0"

  # Cache de lecture persistant (R2)
  drift: ">=2.20.0 <3.0.0"
  # Bloqué sous la 0.6.0 : cette version est marquée « eol » et **retire tout son
  # code** — elle ne livre plus `libsqlite3.so`. Elle ne vaut que pour les projets
  # passés à `sqlite3` 3.x ; ici `sqlite3` reste en 2.x et a besoin de la
  # bibliothèque native. Avec la 0.6.0, l'application se connecte puis lève
  # « Failed to load dynamic library libsqlite3.so » à la première écriture du
  # cache, sans rien afficher. À rouvrir lors du passage à `sqlite3` 3.x.
  sqlite3_flutter_libs: ">=0.5.0 <0.6.0"
  path_provider: ">=2.1.0 <3.0.0"
  path: ">=1.9.0 <2.0.0"

  # Sélecteur de position du carnet d'adresses (R3)
  geolocator: ">=13.0.0 <15.0.0"
  flutter_map: ">=7.0.0 <9.0.0"
  latlong2: ">=0.9.0 <0.11.0"

  # Images distantes (avatars, réalisations)
  cached_network_image: ">=3.3.0 <4.0.0"

  # Rapport d'incident porteur du correlationId (R5)
  sentry_flutter: ">=8.0.0 <10.0.0"

  # Push (R6)
  firebase_core: ">=3.0.0 <5.0.0"
  firebase_messaging: ">=15.0.0 <17.0.0"
  flutter_local_notifications: ">=17.0.0 <23.0.0"

  # Dépôt de fichiers : filtrage et compression avant envoi (R7)
  image_picker: ">=1.1.0 <2.0.0"
  file_picker: ">=8.0.0 <11.0.0"
  flutter_image_compress: ">=2.3.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Icônes de lanceur générées depuis assets/icon/icon.png (T248) :
  # `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.4

  # Génération de code (R9, R2)
  build_runner: ">=2.4.0 <3.0.0"
  freezed: ">=2.5.0 <4.0.0"
  json_serializable: ">=6.8.0 <7.0.0"
  drift_dev: ">=2.20.0 <3.0.0"

  # Tests de contrat rejouant les captures JSON réelles (R12)
  mocktail: ">=1.0.0 <2.0.0"
  http_mock_adapter: ">=0.6.0 <0.7.0"
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Lecture des règles de frontière d'import depuis analysis_options.yaml
  yaml: ^3.1.3

# `path_provider_foundation` >= 2.6 passe par `objective_c`, dont les *build hooks*
# empêchent `build_runner` de compiler son script sur Dart 3.10 (« 'dart compile'
# does not support build hooks »). Le paquet n'est utilisé que sur iOS/macOS et son
# API ne change pas. À retirer dès que la chaîne Dart/build_runner accepte les hooks.
dependency_overrides:
  path_provider_foundation: 2.4.1

# Icônes de lanceur (T248). L'icône source est un aplat de la couleur de marque
# (AppTheme.seed) portant l'initiale — à remplacer par l'identité définitive sans
# toucher à cette configuration : `dart run flutter_launcher_icons` régénère tout.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1B6B4F"
  adaptive_icon_foreground: "assets/icon/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Génération des libellés depuis lib/l10n/app_fr.arb (cf. l10n.yaml)
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
